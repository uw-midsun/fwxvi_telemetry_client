[package]
name = "telemetry_client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "telemetry_client"
path = "src/main.rs"

[dependencies]
eframe            = { version = "0.29", features = ["default"] }
egui              = "0.29"
egui_plot         = "0.29"
egui_extras       = "0.29"
rusqlite          = { version = "0.31", features = ["bundled"] }
serialport        = "4.5"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
serde_yaml        = "0.9"
toml              = "0.8"
chrono            = { version = "0.4", features = ["serde"] }
anyhow            = "1"
crossbeam-channel = "0.5"
rfd               = "0.15"
crc32fast         = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
